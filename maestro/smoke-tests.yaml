appId: com.auth.example
name: "Smoke Tests - Terminal State"
---
- clearState
- launchApp

- scrollUntilVisible:
    element:
      id: "smoke-run-all"
    direction: DOWN

- tapOn:
    id: "smoke-run-all"

- extendedWaitUntil:
    visible:
      id: "smoke-summary"
      text: "(Deterministic checks|Smoke probes): (PASS|PARTIAL|FAIL).*"
    timeout: 60000
- assertVisible:
    id: "smoke-summary"
    text: "Deterministic checks: PASS; provider acceptance: PENDING.*"
- assertNotVisible: "Smoke probes: FAIL.*"
