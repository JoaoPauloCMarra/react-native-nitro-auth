appId: com.auth.example
name: "Smoke Tests - Terminal State"
---

- clearState
- launchApp

- scrollUntilVisible:
    element: "Smoke Tests"
    direction: DOWN

- tapOn: "Run smoke tests"

- extendedWaitUntil:
    visible: "Run smoke tests again"
    timeout: 30000

- extendedWaitUntil:
    visible: ".*passed,.*skipped"
    timeout: 30000
- assertNotVisible: "FAIL"
