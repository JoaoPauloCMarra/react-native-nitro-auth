appId: com.auth.example
name: "Smoke Tests - Terminal State"
---

- clearState
- launchApp

- scrollUntilVisible:
    element: "Smoke Tests"
    direction: DOWN

- tapOn: "Run smoke tests"

- extendedWaitUntil:
    visible: "Complete: (PASS|FAIL).*"
    timeout: 60000
- assertVisible: "Complete: PASS.*"
- assertNotVisible: "Complete: FAIL.*"
