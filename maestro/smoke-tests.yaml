appId: com.auth.example
name: "Smoke Tests - Terminal State"
---

- clearState
- launchApp

- scrollUntilVisible:
    element: "Smoke Tests"
    direction: DOWN

- tapOn: "Run"

- extendedWaitUntil:
    visible: "Run again"
    timeout: 30000

# Terminal state: every test executed, skipped with a reason, or passed.
# The summary always shows "X/Y passed, Z skipped"; a failed row renders a
# "FAIL" status label. No fixed test-count assertion is allowed.
- assertVisible: "passed"
- assertNotVisible: "FAIL"
