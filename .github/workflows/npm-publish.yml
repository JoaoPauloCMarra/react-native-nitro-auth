name: Publish npm

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.14"
  NODE_VERSION: "22"
  NPM_VERSION: "11.19.0"
  PACKAGE_DIR: packages/react-native-nitro-auth

jobs:
  publish:
    name: Publish react-native-nitro-auth
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        if: github.event_name == 'release'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Checkout manual validation ref
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install C++ coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Install npm for trusted publishing
        run: |
          bun install -g "npm@${NPM_VERSION}"
          NPM_BIN="$(bun pm bin -g)"
          printf '%s\n' "$NPM_BIN" >> "$GITHUB_PATH"
          "$NPM_BIN/npm" --version

      - name: Verify release tag
        if: github.event_name == 'release'
        run: |
          PACKAGE_VERSION="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          EXPECTED_REF="refs/tags/${EXPECTED_TAG}"

          if [ "$GITHUB_REF" != "$EXPECTED_REF" ] || [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "Release ref ${GITHUB_REF} does not match expected ${EXPECTED_REF}."
            exit 1
          fi

      - name: Validate publish package
        run: bun scripts/publish.js --dry-run --skip-git-check

      - name: Resolve npm dist tag
        if: github.event_name == 'release'
        id: dist-tag
        env:
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$RELEASE_IS_PRERELEASE" = "true" ]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: github.event_name == 'release'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}" --ignore-scripts
