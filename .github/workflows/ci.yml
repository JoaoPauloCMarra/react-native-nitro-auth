name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  TZ: UTC
  BUN_VERSION: '1.3.14'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality, unit and C++ tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
      - run: bun install --frozen-lockfile
      - name: Unit tests with coverage
        run: bun run test:coverage -- --runInBand --watchman=false
      - name: Release preflight (the publish workflow runs it on Linux)
        env:
          CC: clang
          CXX: clang++
        run: bun run release:preflight

  apple:
    name: Apple native and C++ tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: C++ coverage
        run: bun run --cwd packages/react-native-nitro-auth test:cpp:coverage
      - name: C++ sanitizers
        run: bun run test:cpp:sanitize
      - name: Swift unit tests
        run: bun run test:swift
